name: HeartFlow Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * 1'  # weekly Monday 03:00 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-fund --no-audit 2>&1

      - name: Run HeartFlow audit
        id: audit
        run: bash .github/run-audit.sh

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartflow-audit-report
          path: heartflow-audit-report.md
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        run: bash .github/pr-comment.sh "${{ github.workspace }}/heartflow-audit-report.md"
