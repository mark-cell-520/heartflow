name: 'HeartFlow AI Agent Security Audit'
description: 'Run HeartFlow security audit on your repository. Detects secrets, command injection, path traversal, prompt injection, and MCP-specific risks. Outputs a structured markdown report.'
author: 'yun520-1'

inputs:
  github_token:
    description: 'GitHub token for repository access'
    required: true
    default: ${{ github.token }}
  scan_depth:
    description: 'Scan depth: quick (top-level only) or full (recursive)'
    required: false
    default: 'full'
  output_path:
    description: 'Path to write the audit report'
    required: false
    default: 'heartflow-audit-report.md'
  fail_on_high:
    description: 'Fail the workflow if high-severity findings are detected'
    required: false
    default: 'false'
  upload_report:
    description: 'Upload the report as a workflow artifact'
    required: false
    default: 'true'

outputs:
  report_path:
    description: 'Path to the generated audit report'
    value: ${{ steps.audit.outputs.report_path }}
  risk_level:
    description: 'Overall risk level (Low/Medium/High/Critical)'
    value: ${{ steps.audit.outputs.risk_level }}
  findings_count:
    description: 'Total number of findings'
    value: ${{ steps.audit.outputs.findings_count }}

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'shield'
  color: 'blue'
